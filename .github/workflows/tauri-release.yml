name: Build and Release Desktop App (Tauri)

on:
  push:
    tags:
      - 'v*' # Trigger when a tag is pushed, e.g. v1.0.0
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        
      - name: Install Node dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ToneMatrixEX Desktop ${{ github.ref_name }}'
          releaseBody: 'ToneMatrixEX 桌面离线纯净版 (Exe & DMG)。无需联网，双击即用，已自动排除自带参考音乐以减小包体。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Portable Executable (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rename-Item -Path "src-tauri\target\release\app.exe" -NewName "ToneMatrixEX-Portable.exe"
          gh release upload ${{ github.ref_name }} src-tauri\target\release\ToneMatrixEX-Portable.exe --clobber
